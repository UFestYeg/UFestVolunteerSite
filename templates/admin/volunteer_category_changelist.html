{% extends 'admin/change_list.html' %}

{% block extrastyle %}{{ block.super }}
<style>
  /* The extra export button widens the object-tools; drop them below the
     page title instead of letting Django pull them up onto the title row
     (base.css uses margin-top: -48px), which overlaps long titles. Render
     them as a left-aligned block (like Django's own responsive layout) so
     they don't float over the title or the filter sidebar. */
  /* The extra export button widens the object-tools; drop them below the
     page title instead of letting Django pull them up onto the title row
     (base.css uses margin-top: -48px), which overlaps long titles. Render
     them as a left-aligned block (like Django's own responsive layout) and
     un-float the items, otherwise the floated buttons push the flex
     changelist (a block-formatting context) into the narrow space beside
     them instead of letting it sit below at full width. */
  #content-main > .object-tools {
    margin: 0 0 15px;
    float: none;
    overflow: visible;
  }
  #content-main > .object-tools li {
    float: none;
    display: inline-block;
    height: auto;
  }
</style>
{% endblock %}

{% block object-tools-items %}
    <li><a href="export-schedule/" class="addlink">Export Master Schedule</a></li>
    {{ block.super }}
{% endblock %}
