# CI: install dependencies, type-check, build the frontend, and run the
# frontend (Vitest) and backend (Django) test suites on every push/PR.

name: CI

on:
    push:
        branches: [master, dependency-upgrade-2026]
    pull_request:
        branches: [master]

jobs:
    frontend:
        name: Frontend (build, typecheck, test)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run typecheck

            - name: Build
              env:
                  CI: false
              run: npm run build

            - name: Run unit tests
              run: npm run test:run

    backend:
        name: Backend (Django tests)
        runs-on: ubuntu-latest

        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-insecure-test-secret-key' }}
            DEBUG: "False"

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --dev

            - name: Run migrations
              run: uv run python manage.py migrate

            - name: Run tests
              run: uv run python manage.py test -v 2
